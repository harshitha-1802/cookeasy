<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Main Container -->
  <div class="main-container" id="login-container">
    <div class="background-overlay" id="login-background"></div>
    <div class="form-container">
      <h1>Recipe Finder</h1>
      <p>Find delicious recipes using your ingredients!</p>
      <form class="form" id="login-form">
        <div class="input-group">
          <input type="text" id="login-username" placeholder="Username" required>
        </div>
        <div class="input-group">
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        if (response.ok) {
          const data = await response.json();
          alert(data.message); // Show success message
          console.log('User:', data.user); // Debug log

          // Store the user's data in localStorage
          localStorage.setItem('loggedInUser', JSON.stringify(data.user));

          // Redirect to the index page
          window.location.href = 'index.html';
        } else {
          // If the response is not OK, show an error message
          const errorData = await response.json();
          alert(errorData.message);
          return;
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Something went wrong. Please try again.');
      }
    });
  </script>
</body>
</html>
