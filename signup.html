<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container" id="signup-container">
        <div class="background-overlay" id="signup-background"></div>
        <div class="form-container">
            <h1>Sign Up</h1>
            <p>Create an account to start finding recipes!</p>
            <form class="signup-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="button">Sign Up</button>
            </form>
            <p class="toggle-text">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>
    <script>
        const signupForm = document.querySelector('.signup-form');

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            console.log('Form submitted'); // Debug log

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            console.log({ username, email, password }); // Debug log

            const response = await fetch('http://localhost:3000/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();
            console.log('Response:', data); // Debug log
            alert(data.message);
        });
    </script>
</body>
</html>
